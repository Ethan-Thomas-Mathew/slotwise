name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the code and nothing else. No secrets are used.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA, not a tag: a tag can be
# moved to malicious code (as happened to trivy-action in March 2026); a SHA can't.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create database roles
        run: psql -v ON_ERROR_STOP=1 -f docker/postgres/init.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Check for known-vulnerable production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Unit + integration tests (with coverage thresholds)
        run: pnpm test:coverage
        env:
          MAILPIT_URL: http://localhost:8025
          # The backup tests run pg_dump/pg_restore inside the Postgres service container,
          # so their version matches the server (the runner's own client is newer).
          PG_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage
          retention-days: 7
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Create database roles and migrate
        run: |
          psql -v ON_ERROR_STOP=1 -f docker/postgres/init.sql
          pnpm db:migrate
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          MIGRATION_DATABASE_URL: postgresql://slotwise_owner:owner_password@localhost:5432/slotwise
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t slotwise-api .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t slotwise-web .

      # Trivy (container vulnerability scanner): a pinned release, verified
      # against a checksum written here, so a tampered download fails the build.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          curl -sSfL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
      - name: Scan images for known vulnerabilities
        # Fails on CRITICAL issues that have a fix; lists HIGH ones without failing,
        # so a new CVE in a base image doesn't block unrelated work.
        run: |
          for image in slotwise-api slotwise-web; do
            docker save "$image" -o "$image.tar"
            ./trivy image --input "$image.tar" --no-progress --ignore-unfixed \
              --severity HIGH --exit-code 0
            ./trivy image --input "$image.tar" --no-progress --ignore-unfixed \
              --severity CRITICAL --exit-code 1
          done

  ops-config:
    # Monitoring and Docker config are code too: check them like code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Prometheus config and alert rules are valid; alert unit tests pass
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.5.5 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/ops/prometheus:/p:ro" -w /p --entrypoint promtool \
            prom/prometheus:v3.5.5 check rules alerts.yml
          docker run --rm -v "$PWD/ops/prometheus:/p:ro" -w /p --entrypoint promtool \
            prom/prometheus:v3.5.5 test rules alerts.test.yml
      - name: Grafana dashboard is valid JSON
        run: python3 -m json.tool ops/grafana/dashboards/slotwise.json > /dev/null
      - name: docker-compose.yml is valid with every profile
        run: docker compose --profile full --profile observability config --quiet
