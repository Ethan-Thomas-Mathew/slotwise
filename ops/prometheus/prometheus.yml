# Prometheus: every 15s it asks the API and the worker for their numbers
# (GET /metrics) and stores them, so we can graph them and alert on them.
# Both targets are reached over the private Docker network; their metrics ports
# are never published to your computer or the internet.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:9464']
  - job_name: worker
    static_configs:
      - targets: ['worker:9465']
