# Local infrastructure for development and tests.
# Every port is bound to 127.0.0.1: reachable from this computer only, never
# from other devices on the same Wi-Fi (the passwords here are demo values).
# Start with:  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on the first start, to create the two app roles and databases.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Catches every email the app sends. Open http://localhost:8025 to read them.
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web UI + API

  # ---------------------------------------------------------------------------
  # The whole app, built from source:  docker compose --profile full up --build
  # Then open http://localhost:8080 (emails at http://localhost:8025).
  # ---------------------------------------------------------------------------
  migrate:
    profiles: [full]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: sh -c "node dist/migrate.js && node dist/seed.js"
    environment: &api-env
      NODE_ENV: development
      DATABASE_URL: postgresql://slotwise_app:app_password@postgres:5432/slotwise
      MIGRATION_DATABASE_URL: postgresql://slotwise_owner:owner_password@postgres:5432/slotwise
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:8080
      # The API is reached through nginx (the web container): one proxy hop.
      TRUST_PROXY_HOPS: '1'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      PAYMENTS_PROVIDER: mock
      RAZORPAY_WEBHOOK_SECRET: local-docker-webhook-secret
      # Metrics listen inside the private Docker network so Prometheus can read
      # them. Their ports (9464/9465) are deliberately NOT published below.
      METRICS_HOST: 0.0.0.0
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: [full]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: [full]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ['node', 'dist/worker.js']
    # The image's HEALTHCHECK calls the API's /health endpoint. The worker
    # shares the image but runs no web server, so that check doesn't apply here.
    healthcheck:
      disable: true
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    profiles: [full]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_URL: http://api:3000
    ports:
      - '127.0.0.1:8080:8080'
    depends_on: [api]

  # ---------------------------------------------------------------------------
  # Monitoring (optional), on top of the full app:
  #   docker compose --profile full --profile observability up -d --build
  # Prometheus: http://localhost:9090 (raw metrics, alert rules at /alerts)
  # Grafana:    http://localhost:3001 (the "Slotwise overview" dashboard)
  # Both are bound to 127.0.0.1 and are read-only views; nothing is sent out.
  # ---------------------------------------------------------------------------
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # The admin API and remote reload endpoints stay OFF (they are off by default).
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - '127.0.0.1:9090:9090'

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.4.15
    # No default admin/admin password: a random one is generated on every start
    # and never printed. Nobody logs in; the dashboard is shown read-only.
    entrypoint:
      - sh
      - -c
      - 'GF_SECURITY_ADMIN_PASSWORD="$$(head -c 32 /dev/urandom | base64)" exec /run.sh'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/slotwise.json
      # No phoning home.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:3001:3000'
    depends_on: [prometheus]

volumes:
  pgdata:
  promdata:
